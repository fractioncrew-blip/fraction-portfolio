<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08030d">
<!-- Private team page: kept out of search, the sitemap and the site's nav. No Analytics tag here, so team visits don't count. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Team Fraction | Insights</title>
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@500;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --ground:#08030d; --ground-2:#12081c; --ink:#f8eefb; --muted:#a58fb8; --line:rgba(248,238,251,.13);
  --pink:#ff4fa6; --violet:#9b86ff;
  --display:"Unbounded",system-ui,sans-serif; --body:"Instrument Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--body)}
body{min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(80% 50% at 85% -10%,rgba(255,79,166,.16),transparent 60%),radial-gradient(60% 40% at 0% 0%,rgba(155,134,255,.12),transparent 60%),var(--ground)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px clamp(16px,4vw,40px) 16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font:800 clamp(22px,3vw,30px)/1 var(--display);letter-spacing:-.01em}
h1 span{background:linear-gradient(90deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font:600 14px/1 var(--body);text-decoration:none;color:var(--ink);border:1px solid var(--line);background:rgba(248,238,251,.04)}
.btn:hover{border-color:var(--pink)}
.btn.solid{background:var(--pink);border-color:var(--pink);color:#12030b}
.note{margin:0 clamp(16px,4vw,40px) 14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:14px;background:var(--ground-2)}
.note b{color:var(--ink);font-weight:600}
main{flex:1;display:flex;padding:0 clamp(8px,2vw,40px) clamp(8px,2vw,28px)}
.frame{flex:1;min-height:max(78vh,640px);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
iframe{display:block;width:100%;height:100%;min-height:inherit;border:0}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Team <span>Fraction</span></h1><span class="tag">Website insights · team only</span></div>
  <div class="actions">
    <a class="btn solid" id="open" href="#" target="_blank" rel="noopener">Open full dashboard ↗</a>
    <a class="btn" href="https://analytics.google.com/analytics/web/?authuser=fractioncrew%40gmail.com#/p563180794/realtime/overview" target="_blank" rel="noopener">Live visitors ↗</a>
  </div>
</header>
<p class="note">Only the <b>fractioncrew@gmail.com</b> Google account can see these numbers. If the box below says you need access, sign in to Google as fractioncrew@gmail.com in this browser and reload.</p>
<main>
  <div class="frame"><iframe id="report" title="Team Fraction website insights" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>
</main>
<script>
/* The Data Studio report, shared only with fractioncrew@gmail.com. Google enforces the access, not this page. */
var REPORT='76c30a19-f4aa-492e-918b-11f78ad003ca/page/TlJ0C', AS='?authuser=fractioncrew%40gmail.com';
document.getElementById('report').src='https://datastudio.google.com/embed/reporting/'+REPORT+AS;
document.getElementById('open').href='https://datastudio.google.com/reporting/'+REPORT+AS;
</script>
</body>
</html>
